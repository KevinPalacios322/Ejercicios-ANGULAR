<H1>Login Veterinaria</H1>

<form>
    <label for="usuario">Usuario</label>
    <input type="text" name="usuario" [(ngModel)]="usuario" id="usuario">

    <label for="clave">Clave</label>
    <input type="password" name="clave" [(ngModel)]="clave" id="clave">

    <button type="button" (click)="IniciarSesion()" >Iniciar Sesion</button>




</form>
