<form>
  <label for="nombre">Nombre:</label>
  <input id="nombre" type="text" name="nombre" [(ngModel)]="nombre" placeholder="Ingrese el nombre">

  <label for="especie">Especie:</label>
  <input id="especie" type="text" name="especie" [(ngModel)]="especie" placeholder="Ingrese la especie">

  <label for="edad">Edad:</label>
  <input id="edad" type="number" name="edad" [(ngModel)]="edad" placeholder="Ingrese la edad">

  <label for="propietario">Propietario:</label>
  <input id="propietario" type="text" name="propietario" [(ngModel)]="propietario" placeholder="Ingrese el propietario">

  <button type="button" (click)="GuardarMascota()">Guardar</button>
  <button
    type="button"
    (click)="ActualizarMascota()"
    [disabled]="idEditar === null">
    Actualizar
  </button>
  <button
    type="button"
    (click)="CancelarEdicion()"
    [disabled]="idEditar === null">
    Cancelar
  </button>
</form>

<h2>Mascotas Registradas</h2>

<table border="1" cellpadding="10" cellspacing="0">
  <thead>
    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <th>Especie</th>
      <th>Edad</th>
      <th>Propietario</th>
      <th>Acciones</th>
    </tr>
  </thead>
  <tbody>
    @for (mascota of mascotas; track mascota.id) {
      <tr>
        <td>{{ mascota.id }}</td>
        <td>{{ mascota.nombre }}</td>
        <td>{{ mascota.especie }}</td>
        <td>{{ mascota.edad }}</td>
        <td>{{ mascota.propietario }}</td>
        <td>
          <button type="button" (click)="EditarMascota(mascota)">Editar</button>
          <button type="button" (click)="EliminarMascota(mascota.id)">Eliminar</button>
        </td>
      </tr>
    }
  </tbody>
</table>
