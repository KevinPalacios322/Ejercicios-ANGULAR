

    <form>
        <label for="codigo">Codigo: </label>
        <input id="codigo" type="text" name="codigo" [(ngModel)]="codigo" placeholder="Ingrese el codigo">

        <label for="nombre">Nombre: </label>
        <input id="nombre" type="text" name="nombre" [(ngModel)]="nombre" placeholder="Ingrese el nombre">

        <label for="precio">Precio: </label>
        <input id="precio" type="number" name="precio" [(ngModel)]="precio" placeholder="Ingrese el precio">

        <label for="existencia">Existencias: </label>
        <input id="existencia" type="number" name="existencia" [(ngModel)]="existencia" placeholder="Ingrese Existencias">

        <button type="button" (click)="GuardarProducto()">Guardar</button>
    </form>

    <button  (click)="CerrarSesion()">CerrarSesion</button>
