<H1>AGREGAR TAREA</H1>

<div class="formulario" ><Form>
    <div class="campo"><label for="titulo">Titulo</label>
    <input type="text" [(ngModel)]="titulo" name="titulo" id="titulo">
    </div><br>

    <div class="campo "><label for="descripcion">Descripcion</label>
    <input type="text" [(ngModel)]="descripcion" name="descripcion" id="descripcion">
    </div><br>

    <div class="campo" ><label for="FechaLimite">Fecha Limite</label>
    <input type="date" [(ngModel)]="FechaLimite" name="FechaLimite" id="FechaLimite">
    </div><br>

    <div class="campo"><label>Estado</label>
    <select [(ngModel)]="estado" >
        <option value="Pendiente">Pendiente</option>
        <option value="Completada">Completada</option>

    </select>
    </div><br>

    <button type="button" (click)="IngresarTarea()">Guardar Tarea</button>

</Form></div>

<table>
    <thead>
        <tr>
            <th>Id</th>
            <th>Titulo</th>
            <th>Descripcion</th>
            <th>FechaLimite</th>
            <th>Estado</th>
            <th>Opciones</th>
        </tr>


    </thead>
    <tbody>
        @for (tarea of ListaTareasD; track $index)  {

            
               
                <tr>
                    <th>{{tarea.id}}</th>
                    <th>{{tarea.titulo}}</th>
                    <th>{{tarea.descripcion}}</th>
                    <th>{{tarea.FechaLimite}}</th>
                    <th>{{tarea.estado}}</th>
                    <th><Button type="button" (click)="EliminarTarea(tarea.id)">Eliminar</Button></th>
                     <th><Button type="button" (click)="Apartado_Tarea(tarea.id)">Actualizar</Button></th>
                </tr>

            
        }
       

    </tbody>

</table>
<br>

@if (editando) {

    <h1>Actualizar Datos</h1>

    <div class="campo"><label for="titulo">Titulo</label>
    <input type="text" [(ngModel)]="TareaEditar.titulo" placeholder="TareaEditar.titulo">
    </div><br>

    <div class="campo "><label for="descripcion">Descripcion</label>
    <input type="text" [(ngModel)]="TareaEditar.descripcion" placeholder="TareaEditar.descripcion">
    </div><br>

    <div class="campo" ><label for="FechaLimite">Fecha Limite</label>
    <input type="date" [(ngModel)]="TareaEditar.FechaLimite" placeholder="TareaEditar.FechaLimite">
    </div><br>

    <div class="campo"><label>Estado</label>
    <select [(ngModel)]="TareaEditar.estado" >
        <option value="Pendiente">Pendiente</option>
        <option value="Completada">Completada</option>

    </select>
    </div><br>

    <button type="button" (click)="ActualizarTarea(TareaEditar.id)">Actualizar Tarea</button>
    <button (click)="CancelarActu()" >Cancelar</button>

}
